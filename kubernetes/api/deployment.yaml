apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-kind-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-kind-api
  template:
    metadata:
      labels:
        app: k8s-kind-api
    spec:
      containers:
        - name: api
          image: k8s-kind-api:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000